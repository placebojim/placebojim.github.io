<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>deck.gl transition flicker test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    #deck-container { position: absolute; inset: 0; background: #dce8f0; }
    #panel {
      position: absolute; top: 8px; left: 8px; z-index: 10;
      background: rgba(255,255,255,0.9); border-radius: 8px; padding: 8px 10px;
      box-shadow: 0 2px 8px #0003; font-size: 14px; max-width: 260px;
    }
    #panel label { display: block; margin: 4px 0; }
    #panel .hint { color: #666; font-size: 11px; margin-top: 6px; }
    #gl-info { color: #333; font-size: 10px; margin-top: 6px; word-break: break-all; }
  </style>
  <script type="module" crossorigin src="/player-b/assets/wxTransitionTest.92f3f3b7.js"></script>
  <link rel="modulepreload" crossorigin href="/player-b/assets/modulepreload-polyfill.c7c6310f.js">
  <link rel="modulepreload" crossorigin href="/player-b/assets/scatterplot-layer.2ffc7318.js">
</head>
<body>
  <div id="deck-container"></div>
  <div id="panel">
    <label><input type="checkbox" id="chk-transitions" checked> transitions (color, 300ms)</label>
    <label><input type="checkbox" id="chk-icon"> IconLayer (off = ScatterplotLayer)</label>
    <label><input type="checkbox" id="chk-auto"> auto shuffle (2s)</label>
    <button id="btn-shuffle">shuffle colors</button>
    <div class="hint">Bare-bones case: ScatterplotLayer + color transition. Shuffle fires a real transition — blink/no-fade on shuffle = bug. Toggle IconLayer to compare.</div>
    <div id="gl-info"></div>
  </div>
  
</body>
</html>
