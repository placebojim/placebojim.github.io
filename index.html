<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #fff; padding: 2em; text-align: center; border-bottom: 1px solid #ddd; }
    header a { color: #000; margin: 0 1.5em; text-decoration: none; font-weight: bold; }
    header nav { display: flex; gap: 1.5em; justify-content: center; }
    #container { max-width: 700px; margin: 2em auto; padding: 2em; flex: 1; }
    #file-list { margin-bottom: 2em; }
    #file-list button { margin-right: 0.5em; margin-bottom: 0.5em; }
    #markdown-content { line-height: 1.7; }
    pre, code { background: #f4f4f4; border-radius: 4px; }
    footer { background: #fff; padding: 2em; display: flex; justify-content: flex-end; gap: 1em; border-top: 1px solid #ddd; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.setOptions({ breaks: true });
    
    // Redirect if ?id= parameter exists
    const params = new URLSearchParams(window.location.search);
    if (params.has('id')) {
      window.location.href = 'https://placebojim.github.io/player/' + window.location.search;
    }
  </script>
</head>
<body>
  <header>
    <nav>
      <a href="#projects.md" id="nav-projects">Projects</a>
      <a href="#about.md" id="nav-contact">About</a>
    </nav>
  </header>
  <div id="container">
    <div id="markdown-content">Loading...</div>
  </div>
  <footer>
    <a href="https://www.linkedin.com/in/josh-groom-4023543/" title="LinkedIn"><img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" width="24" height="24" alt="LinkedIn"></a>
    <a href="https://www.facebook.com/joshua.groom.92/" title="Facebook"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" width="24" height="24" alt="Facebook"></a>
    <a href="https://github.com/placebojim" title="GitHub"><img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" width="24" height="24" alt="GitHub"></a>
  </footer>
  <script>
    function setHash(filename) {
      if (location.hash !== '#' + filename) {
        location.hash = '#' + filename;
      }
    }

    // Header nav links
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('nav-projects').addEventListener('click', function(e) {
        e.preventDefault();
        setHash('projects.md');
      });
      document.getElementById('nav-contact').addEventListener('click', function(e) {
        e.preventDefault();
        setHash('about.md');
      });
    });

    async function loadMarkdown(filename, pushState = true) {
      const res = await fetch(`site-md/${filename}`);
      const text = await res.text();
      document.getElementById('markdown-content').innerHTML = marked.parse(text);
      // Intercept .md links in rendered markdown
      document.querySelectorAll('#markdown-content a[href$=".md"]').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const file = link.getAttribute('href');
          setHash(file);
        });
      });
    }

    // Handle hash changes for back/forward navigation
    window.addEventListener('hashchange', () => {
      const file = location.hash ? location.hash.slice(1) : 'projects.md';
      loadMarkdown(file, false);
    });

    // Load file from hash or default to index.md on page load
    window.addEventListener('DOMContentLoaded', () => {
      const file = location.hash ? location.hash.slice(1) : 'projects.md';
      loadMarkdown(file, false);
    });
  </script>
</body>
</html>
